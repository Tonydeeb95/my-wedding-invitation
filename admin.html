<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | إدارة دعوات العرس</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-xl mx-auto bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
        <h1 class="text-2xl font-bold text-amber-400 mb-6 text-center">إنشاء رابط دعوة جديد</h1>
        
        <form id="admin-form" class="space-y-4">
            <div>
                <label class="block text-sm mb-1">الاسم بالعربية</label>
                <input type="text" id="name_ar" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
            </div>
            <div>
                <label class="block text-sm mb-1">الاسم بالإنجليزي</label>
                <input type="text" id="name_en" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
            </div>
            <div>
                <label class="block text-sm mb-1">الاسم بالألماني</label>
                <input type="text" id="name_de" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
            </div>
            <div>
                <label class="block text-sm mb-1">العدد الأقصى المسموح</label>
                <input type="number" id="maxGuests" value="2" min="1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
            </div>
            <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold py-3 rounded-lg hover:bg-amber-400 transition">إنشاء وتخزين الدعوة</button>
        </form>

        <div id="result-box" class="mt-6 hidden bg-slate-900 p-4 rounded-lg border border-amber-500/30">
            <p class="text-xs text-slate-400 mb-1">الرابط المخصص للضيف (جاهز للنسخ):</p>
            <input type="text" id="generated-link" readonly class="w-full bg-slate-800 p-2 text-amber-400 text-sm rounded border border-slate-700 select-all">
        </div>
    </div>

    <script>
        // ضع رابط Google Apps Script الذي نسخته هنا
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzeL7dpfUv23aQpi18toFxv6q9TktYMctRIaeISqiSCEQosiuXF0xcgtYpbzKzsDUoYg/exec";
        // ضع رابط موقع الدعوة الرئيسي الخاص بك هنا
        const BASE_INVITE_URL = "https://tonydeeb95.github.io/my-wedding-invitation/";

        document.getElementById('admin-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const guestId = 'g_' + Math.random().toString(36).substr(2, 9);
            const payload = {
                action: "addGuest",
                guestId: guestId,
                name_ar: document.getElementById('name_ar').value,
                name_en: document.getElementById('name_en').value,
                name_de: document.getElementById('name_de').value,
                maxGuests: parseInt(document.getElementById('maxGuests').value)
            };

            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });

            const inviteUrl = `${BASE_INVITE_URL}?id=${guestId}`;
            document.getElementById('generated-link').value = inviteUrl;
            document.getElementById('result-box').classList.remove('hidden');
        });
    </script>
</body>
</html>
